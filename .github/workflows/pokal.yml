# Pokal auslosen und anlegen - immer nur per Knopf (Reiter "Actions" -> "Pokal" -> "Run workflow").
# Ergebnisse einer Pokalrunde auswerten: im Workflow "KBL Spieltag" Spieltagsnummer + Pokal-Haken.
name: Pokal

on:
  workflow_dispatch:
    inputs:
      system:
        description: "Ligasystem"
        type: choice
        options: [kbl, kwbl]
        default: kbl
      aktion:
        description: "Was soll passieren?"
        type: choice
        options:
          - Live-Auslosung terminieren
          - Runde sofort auslosen
          - Ankuendigung zuruecknehmen
          - Neuen Pokal anlegen
        default: Live-Auslosung terminieren
      start:
        description: "Nur Live: Startzeit (deutsche Zeit), z. B. 20:00 oder 20.10. 20:00 – mind. 15 Min., höchstens ca. 5 Std. im Voraus"
        required: false
        default: ""
      sekunden:
        description: "Nur Live: Sekunden pro Kugel"
        required: false
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.los.outputs.live }}
      geaendert: ${{ steps.speichern.outputs.geaendert }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt
      - name: Pokal
        id: los
        env:
          SYSTEM: ${{ inputs.system }}
          AKTION: ${{ inputs.aktion }}
          START: ${{ inputs.start }}
          SEKUNDEN: ${{ inputs.sekunden }}
          PYTHONIOENCODING: utf-8
        run: |
          case "$AKTION" in
            "Live-Auslosung terminieren")  python pokal.py "$SYSTEM" ankuendigen --start "$START" --sekunden "$SEKUNDEN"
                                           echo "live=true" >> "$GITHUB_OUTPUT" ;;
            "Runde sofort auslosen")       python pokal.py "$SYSTEM" auslosen ;;
            "Ankuendigung zuruecknehmen")  python pokal.py "$SYSTEM" absagen ;;
            "Neuen Pokal anlegen")         python pokal.py "$SYSTEM" neu ;;
          esac
      - name: Paarungsbild zum Herunterladen
        uses: actions/upload-artifact@v6
        with:
          name: Pokal-${{ inputs.system }}-${{ github.run_number }}
          path: league_systems/${{ inputs.system }}/tables/
          if-no-files-found: ignore
          retention-days: 30
      - name: Speichern
        id: speichern
        env:
          SYSTEM: ${{ inputs.system }}
          AKTION: ${{ inputs.aktion }}
        run: 'bash .github/speichern.sh "${SYSTEM^^}-Pokal: $AKTION"'

  webseite:
    needs: vorbereiten
    if: needs.vorbereiten.outputs.geaendert == 'true'
    uses: ./.github/workflows/webseite.yml

  # Nur bei Live-Auslosung: bis kurz vor dem Start warten, dann auslosen und veroeffentlichen.
  # Zum Absagen diesen Lauf abbrechen (Cancel) und "Ankuendigung zuruecknehmen" starten.
  ziehen:
    needs: [vorbereiten, webseite]
    if: always() && needs.vorbereiten.result == 'success' && needs.vorbereiten.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      geaendert: ${{ steps.speichern.outputs.geaendert }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt
      - name: Warten bis kurz vor dem Start
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python pokal.py "${{ inputs.system }}" warten
      - name: Auslosen
        env:
          PYTHONIOENCODING: utf-8
        run: |
          git pull -q --rebase --autostash
          python pokal.py "${{ inputs.system }}" live-ziehen
      - name: Paarungsbild zum Herunterladen
        uses: actions/upload-artifact@v6
        with:
          name: Pokal-${{ inputs.system }}-${{ github.run_number }}-Paarungen
          path: league_systems/${{ inputs.system }}/tables/
          if-no-files-found: ignore
          retention-days: 30
      - name: Speichern
        id: speichern
        env:
          SYSTEM: ${{ inputs.system }}
        run: 'bash .github/speichern.sh "${SYSTEM^^}-Pokal - Live-Auslosung"'

  webseite-live:
    needs: ziehen
    if: needs.ziehen.outputs.geaendert == 'true'
    uses: ./.github/workflows/webseite.yml
