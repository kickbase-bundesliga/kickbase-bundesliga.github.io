# Baut die Webseite aus den Daten im Repository und veroeffentlicht sie (GitHub Pages).
# Laeuft automatisch, wenn Daten, Info-Texte oder die Vorlage geaendert werden,
# nach jedem automatischen Spieltags-Update, und per Knopf "Run workflow".
name: Webseite

on:
  push:
    branches: [main]
    paths:
      - "league_systems/**"
      - "marktwerte/**"
      - "config/**"
      - "website/**"
      - "scripts/build_site.py"
      - "scripts/statistik.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      artefakt:
        description: "Name des Pages-Pakets. Muss je Lauf eindeutig sein, wenn ein Lauf die Webseite mehrmals veroeffentlicht (z. B. Pokal: Ankuendigung + Ziehung)."
        type: string
        default: github-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webseite
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Webseite bauen
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          name: ${{ inputs.artefakt || 'github-pages' }}

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artefakt || 'github-pages' }}
