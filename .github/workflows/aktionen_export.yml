# Spieler-Aktionen (Punkteverteilung) fuer einzelne Spieltage holen - nur manuell.
# Die Daten werden NICHT ins Repository geschrieben, sondern nur gepackt im Log des Laufs ausgegeben;
# Claude holt sie fuer die Aktionsauswertung ab und loescht den Lauf danach.
name: Aktionen export

on:
  workflow_dispatch:
    inputs:
      spieltage:
        description: "Spieltage, z. B. 8-9"
        required: true

permissions:
  contents: read

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt
      - name: Aktionen holen
        env:
          KBL_EMAIL: ${{ secrets.KBL_EMAIL }}
          KBL_PASSWORT: ${{ secrets.KBL_PASSWORT }}
          SPIELTAGE: ${{ inputs.spieltage }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python scripts/aktionen_sammeln.py --nur "$SPIELTAGE"
      # Ausgabe gepackt im Log (Artefakt-Downloads sind aus Claudes Umgebung gesperrt);
      # Claude loescht den Lauf samt Log nach dem Abholen.
      - name: Daten ausgeben
        run: |
          echo "===DATEN-ANFANG==="
          tar czf - aktionen/*/spieltag_*.json aktionen/*/kader.json | base64 -w 76
          echo "===DATEN-ENDE==="
