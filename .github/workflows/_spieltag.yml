# Gemeinsamer Ablauf fuer alle Ligasysteme. Wird von kbl.yml, kwbl.yml, ... aufgerufen,
# nicht direkt. Ein neues Ligasystem braucht nur eine neue kleine Datei wie kwbl.yml.
name: _spieltag (Baustein)

on:
  workflow_call:
    inputs:
      system:      { type: string,  required: true }
      spieltag:    { type: string,  required: false, default: "" }
      pokal:       { type: boolean, required: false, default: false }
      ohne_bilder: { type: boolean, required: false, default: false }
      nur_pruefen: { type: boolean, required: false, default: false }
    secrets:
      EMAIL:    { required: true }
      PASSWORT: { required: true }
    outputs:
      geaendert:
        description: "true, wenn neue Daten gespeichert wurden"
        value: ${{ jobs.update.outputs.geaendert }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      geaendert: ${{ steps.speichern.outputs.geaendert }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Pakete installieren
        run: pip install -r .github/requirements-ci.txt

      - name: Spieltag einspielen
        env:
          SYSTEM: ${{ inputs.system }}
          SPIELTAG: ${{ inputs.spieltag }}
          POKAL: ${{ inputs.pokal }}
          OHNE_BILDER: ${{ inputs.ohne_bilder }}
          NUR_PRUEFEN: ${{ inputs.nur_pruefen }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORT: ${{ secrets.PASSWORT }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p "league_systems/$SYSTEM/tables"
          PREFIX=$(echo "$SYSTEM" | tr '[:lower:]' '[:upper:]')
          export "${PREFIX}_EMAIL=$EMAIL" "${PREFIX}_PASSWORT=$PASSWORT"
          ARGS=("$SYSTEM" --ohne-webseite)
          [ -n "$SPIELTAG" ]          && ARGS+=(--spieltag "$SPIELTAG")
          if [ "$POKAL" = "true" ] && [ -z "$SPIELTAG" ]; then
            echo "::error::Fuer die Pokalrunde bitte auch die Spieltagsnummer eintragen."; exit 1
          fi
          [ "$POKAL" = "true" ]       && ARGS+=(--pokal)
          [ "$OHNE_BILDER" = "true" ] && ARGS+=(--ohne-bilder)
          [ "$NUR_PRUEFEN" = "true" ] && ARGS+=(--pruefen)
          python automatik.py "${ARGS[@]}"

      - name: Tabellenbilder zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: Tabellenbilder-${{ inputs.system }}-${{ github.run_number }}
          path: league_systems/${{ inputs.system }}/tables/
          if-no-files-found: ignore
          retention-days: 30

      - name: Neue Daten speichern
        id: speichern
        env:
          SYSTEM: ${{ inputs.system }}
        run: |
          STAND=$(python -c "import json;print(json.load(open('league_systems/$SYSTEM/automatik_status.json'))['letzter_spieltag'])" 2>/dev/null || echo "?")
          bash .github/speichern.sh "${SYSTEM^^}: Daten bis Bundesliga-Spieltag $STAND"
